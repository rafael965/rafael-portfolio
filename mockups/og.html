<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;background:#dce1de;color:#1f2421;font-family:Archivo,sans-serif;
 padding:64px 72px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;position:relative}
body::after{content:"";position:absolute;right:-90px;bottom:-90px;width:420px;height:420px;border-radius:50%;background:#9cc5a1;opacity:.55}
.mono{font-family:"JetBrains Mono",monospace;font-size:15px;letter-spacing:.16em;text-transform:uppercase;font-weight:500}
.pill{display:inline-flex;align-items:center;gap:10px;border:1px solid rgba(31,36,33,.2);border-radius:999px;padding:9px 18px;background:#f2f5f3;position:relative;z-index:1;align-self:flex-start}
.dot{width:9px;height:9px;border-radius:50%;background:#49a078}
h1{font-size:132px;font-weight:800;line-height:.84;letter-spacing:-.055em;text-transform:uppercase;position:relative;z-index:1}
h1 .o{color:transparent;-webkit-text-stroke:2.5px #1f2421;display:block}
p{font-size:26px;font-weight:600;letter-spacing:-.02em;position:relative;z-index:1}
.rule{height:1px;background:#1f2421;margin:26px 0 20px;position:relative;z-index:1}
.foot{display:flex;justify-content:space-between;color:#216869;position:relative;z-index:1}
</style></head><body>
<span class="pill mono"><i class="dot"></i>Available for work</span>
<div>
  <h1><span class="o">Rafael</span><span>Reyes</span></h1>
  <div class="rule"></div>
  <p>Operations Manager &amp; AI Systems Builder</p>
</div>
<div class="foot mono"><span>Legal · Construction · Marketing</span><span>9 years</span></div>
</body></html>
